[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-failure-orchestrator"
version = "0.3.1"
description = "Dependency-aware CI/CD/CT failure control plane with bounded autonomous repair"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
ci-orchestrator = "ci_failure_orchestrator.cli:main"

[tool.setuptools]
packages = ["ci_failure_orchestrator"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ci_failure_orchestrator"]

[tool.coverage.report]
show_missing = true
skip_covered = true
