[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-failure-orchestrator"
version = "1.2.0"
description = "Agentic CI reliability control plane with canonical repair, release-readiness, and production-success gates, bounded autonomy, multi-provider routing, safe candidate tournaments, SLOs, canaries, fleet policy, benchmarks, and production proof"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]
openai = ["openai>=1.0"]
observability = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]

[project.scripts]
ci-orchestrator = "ci_failure_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ci_failure_orchestrator*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[tool.coverage.run]
branch = true
source = ["ci_failure_orchestrator"]

[tool.coverage.report]
show_missing = true
skip_covered = true
