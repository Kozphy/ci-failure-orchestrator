[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-failure-orchestrator"
version = "0.3.0"
description = "Dependency-aware CI/CD/CT failure control plane with bounded autonomous repair"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ci-orchestrator = "ci_failure_orchestrator.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
