name: Live Semantic Merge Eval

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI model id
        required: true
        default: gpt-5.6
      trials:
        description: Repeated trials per held-out case
        required: true
        default: '3'

permissions:
  contents: read

jobs:
  live-eval:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require API key
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY repository secret is required"
            exit 1
          fi
      - name: Install
        run: python -m pip install -e ".[dev,openai]"
      - name: Run offline regression tests
        run: python -m pytest
      - name: Run live held-out semantic merge evaluation
        run: >-
          python scripts/run_live_semantic_merge_eval.py
          --model "${{ inputs.model }}"
          --trials "${{ inputs.trials }}"
      - name: Upload live semantic evidence
        uses: actions/upload-artifact@v4
        with:
          name: live-semantic-merge-evidence
          path: artifacts/live-semantic-merge-eval.json
