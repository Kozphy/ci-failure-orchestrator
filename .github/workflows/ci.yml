name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Tests with coverage
        run: pytest --cov=ci_failure_orchestrator --cov-report=term-missing --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
      - name: Orchestrator smoke test
        run: ci-orchestrator rank --pipeline examples/pipeline.json --failures examples/failures.json --audit audit.jsonl
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-orchestrator-audit
          path: audit.jsonl
          if-no-files-found: ignore
