name: ct

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  continuous-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Control-plane regression tests
        run: pytest tests/test_control_plane.py
      - name: Full regression suite
        run: pytest
