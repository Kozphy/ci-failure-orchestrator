name: research-evidence

on:
  push:
    paths:
      - "benchmark/**"
      - "baselines/**"
      - "experiments/**"
      - "ci_failure_orchestrator/research_evaluation.py"
      - "ci_failure_orchestrator/baselines.py"
      - "scripts/run_research_rq1.py"
      - "scripts/run_baseline_matrix.py"
      - "tests/test_research_evaluation.py"
      - "tests/test_baselines.py"
      - ".github/workflows/research-evidence.yml"
  pull_request:
    paths:
      - "benchmark/**"
      - "baselines/**"
      - "experiments/**"
      - "ci_failure_orchestrator/research_evaluation.py"
      - "ci_failure_orchestrator/baselines.py"
      - "scripts/run_research_rq1.py"
      - "scripts/run_baseline_matrix.py"
      - "tests/test_research_evaluation.py"
      - "tests/test_baselines.py"
      - ".github/workflows/research-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test research evaluation code
        run: pytest tests/test_research_evaluation.py tests/test_baselines.py

      - name: Run deterministic baseline matrix
        run: python scripts/run_baseline_matrix.py

      - name: Run RQ1 paired evaluation
        run: python scripts/run_research_rq1.py

      - name: Publish research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: research-evidence-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/research/baseline-matrix.json
            artifacts/research/rq1.json
