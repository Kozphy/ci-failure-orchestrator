name: repair-benchmark

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Run repair benchmark tests
        run: pytest -q tests/test_repair_benchmark.py
      - name: Run control-plane regression suite
        run: pytest -q tests/test_control_plane.py
