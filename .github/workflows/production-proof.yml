name: Production Proof

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Evaluate production-proof contract
        run: python scripts/check_production_gate.py benchmark/production_metrics.example.json
      - name: Upload production evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-proof
          path: artifacts/production-gate.json
